name: Acceptance Test cases
on:
  pull_request:
  repository_dispatch:
    types: [ok-to-test-command]
jobs:
  Acceptance-Tests:
    runs-on: self-hosted
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Trigger Event
        run: |
          echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - name: Runner Info
        run: |
          echo "🐧 This job is now running on runner: $RUNNER_NAME (OS: ${{ runner.os }})"

      - name: Install base tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git unzip sshpass build-essential sudo nmap

      - name: Pull Request Info
        run: |
          echo "your repository is ${{ github.repository }}."
          echo "PR Number: ${{ github.event.client_payload.pull_request.number }}"
          echo "Branch Name: ${{ github.event.client_payload.pull_request.head.ref }}"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: "refs/pull/${{ github.event.client_payload.pull_request.number }}/merge"

      - name: Remove Cached Go Versions
        run: |
          sudo rm -rf /home/ubuntu/actions-runner/_work/_tool/go
          sudo rm -rf /usr/local/go
          sudo apt remove --purge golang -y
          hash -r  # Clear shell path cache

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          check-latest: true
          cache: true # Enables module caching

      - name: Verify Go Installation
        run: |
          go version
          which go

      - name: Set Go Environment
        run: |
          echo "GOPATH=$HOME/go" >> $GITHUB_ENV
          echo "PATH=$HOME/go/bin:$PATH" >> $GITHUB_ENV

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          go mod tidy
          go mod vendor

      - name: Install unzip and sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y unzip sshpass

      - name: Setup Terraform v1.10.5
        run: |
          set -e  # Exit on error
          TERRAFORM_VERSION="1.10.5"
          curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          if [ ! -f terraform.zip ]; then
            echo "Terraform zip file not found!"
            exit 1
          fi
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          rm terraform.zip  # Cleanup
          echo "✅ Terraform Installed Successfully!"
          terraform version

      - name: Set environment variables
        run: |
            echo "NUTANIX_PE_PASSWORD=${{ secrets.NUTANIX_PE_PASSWORD }}" >> $GITHUB_ENV
            echo "NUTANIX_PE_USERNAME=${{ secrets.NUTANIX_PE_USERNAME }}" >> $GITHUB_ENV
            echo "NUTANIX_USERNAME=${{ secrets.NUTANIX_USERNAME }}" >> $GITHUB_ENV
            echo "NUTANIX_PASSWORD=${{ secrets.NUTANIX_PASSWORD }}" >> $GITHUB_ENV
            echo "NUTANIX_API_KEY=${{ secrets.NUTANIX_API_KEY }}" >> $GITHUB_ENV
            echo "NUTANIX_INSECURE=${{ secrets.NUTANIX_INSECURE }}" >> $GITHUB_ENV
            echo "NUTANIX_PORT=${{ secrets.NUTANIX_PORT }}" >> $GITHUB_ENV
            echo "NUTANIX_ENDPOINT=${{ secrets.NUTANIX_ENDPOINT }}" >> $GITHUB_ENV
            echo "FOUNDATION_ENDPOINT=${{ secrets.FOUNDATION_ENDPOINT }}" >> $GITHUB_ENV
            echo "FOUNDATION_PORT=${{ secrets.FOUNDATION_PORT }}" >> $GITHUB_ENV
            echo "NOS_IMAGE_TEST_URL=${{ secrets.NOS_IMAGE_TEST_URL }}" >> $GITHUB_ENV
            echo "NDB_ENDPOINT=${{ secrets.NDB_ENDPOINT }}" >> $GITHUB_ENV
            echo "NDB_PASSWORD=${{ secrets.NDB_PASSWORD }}" >> $GITHUB_ENV
            echo "NDB_USERNAME=${{ secrets.NDB_USERNAME }}" >> $GITHUB_ENV
            echo "PROTECTION_RULES_TEST_FLAG=${{ secrets.PROTECTION_RULES_TEST_FLAG }}" >> $GITHUB_ENV
            echo "CGO_ENABLED=${{ secrets.CGO_ENABLED }}" >> $GITHUB_ENV
            echo "TF_LOG_SDK_HELPER_RESOURCE=OFF" >> $GITHUB_ENV
            echo "TF_LOG_SDK=OFF" >> $GITHUB_ENV
            echo "TF_LOG_CORE=OFF" >> $GITHUB_ENV

      - name: Check gofmt
        run: |
            echo "==> Checking that code complies with gofmt requirements..."
            gofmt_files=$(gofmt -l `find . -name '*.go' | grep -v vendor`)
            if [[ -n ${gofmt_files} ]]; then
                echo 'gofmt needs running on the following files:'
                echo "${gofmt_files}"
                echo "You can use the command: \`make fmt\` to reformat code."
                exit 1
            else
                echo "No gofmt issues found."
            fi
        continue-on-error: true

      - name: Acceptance test cases
        id: test-execution
        run: |
              echo "tests_executed=tests_execution_not_successful" >> $GITHUB_OUTPUT
              args="${{ github.event.client_payload.slash_command.args }}"

              # Treat '|' the same as space. Comments like:
              #   /ok-to-test TestA| TestB| TestC
              # must not become -run='TestA||TestB||TestC'.
              normalized_args="${args//|/ }"

              package_path="./..."
              next_is_package=false
              cover_scope=""
              scope_label=""
              tokens=()
              for arg in $normalized_args; do
                  if [[ "$next_is_package" == true ]]; then
                      package_path="./nutanix/services/$arg"
                      cover_scope="package"
                      next_is_package=false
                      echo "📦 Running tests only in package: $package_path"
                      continue
                  fi
                  if [[ "$arg" == "-p" ]]; then
                      next_is_package=true
                      continue
                  fi
                  [[ -z "$arg" ]] && continue
                  tokens+=("$arg")
              done

              runFlag=""
              n=${#tokens[@]}
              index=0
              for provider in "${tokens[@]}"; do
                  case "$provider" in
                      foundation)
                          mapped="TestAccFoundation*"
                          [[ -z "$cover_scope" ]] && cover_scope="foundation"
                          ;;
                      foundation_central)
                          mapped="TestAccFC*"
                          [[ -z "$cover_scope" ]] && cover_scope="foundation_central"
                          ;;
                      karbon)
                          mapped="TestAccKarbon*"
                          [[ -z "$cover_scope" ]] && cover_scope="karbon"
                          ;;
                      v3)
                          mapped="TestAccNutanix*"
                          [[ -z "$cover_scope" ]] && cover_scope="v3"
                          ;;
                      v4)
                          mapped="TestAccV2Nutanix*"
                          [[ -z "$cover_scope" ]] && cover_scope="v4"
                          ;;
                      lcm)
                          mapped="TestAccV2NutanixLcm*"
                          [[ -z "$cover_scope" ]] && cover_scope="lcm"
                          ;;
                      era)
                          mapped="TestAccEra*"
                          [[ -z "$cover_scope" ]] && cover_scope="era"
                          ;;
                      *)
                          echo "running individual testcase/package"
                          mapped="$provider"
                          ;;
                  esac
                  runFlag+="$mapped"
                  if [ $index -lt $((n-1)) ]; then
                      runFlag+="|"
                  fi
                  index=$((index+1))
              done

              echo "==> Setup Foundation Config"
              echo '${{ secrets.FOUNDATION_CONFIG }}' > test_foundation_config.json
              echo "==> Setup PC Config"
              echo '${{ secrets.PC_CONFIG }}' > test_config.json
              echo "==> Setup V4 Config"
              echo '${{ secrets.V4_CONFIG }}' > test_config_v2.json
              echo "==> Running testcases..."

              if [[ "$package_path" != "./..." ]]; then
                  if [[ -n "$runFlag" ]]; then
                      TESTARGS="-run=${runFlag}"
                  else
                      TESTARGS="-run=."
                  fi
              else
                  if [[ -z "$runFlag" ]]; then
                      echo "Error: no test names or provider aliases given."
                      echo "Separate test names with spaces (the workflow joins them with '|'):"
                      echo "  /ok-to-test TestAccFoo TestAccBar"
                      echo "  /ok-to-test v4"
                      exit 1
                  fi
                  TESTARGS="-run=${runFlag}"
              fi

              # Fail closed: empty '|' alternatives match ALL tests.
              run_pattern="${TESTARGS#-run=}"
              if [[ "$run_pattern" == *"||"* || "$run_pattern" == "|"* || "$run_pattern" == *"|" ]]; then
                  echo "Error: -run pattern '$run_pattern' has an empty '|'-alternative."
                  echo "That regexp matches every test. Use spaces between names, not 'Name| Name'."
                  echo "  /ok-to-test TestAccFoo TestAccBar"
                  exit 1
              fi

              # Resolve -coverpkg the same way as `make acc-test`.
              coverpkg=""
              if [[ "$package_path" != "./..." ]]; then
                  coverpkg="$package_path"
                  scope_label="package $package_path"
              else
                  case "$cover_scope" in
                      v4)
                          for d in nutanix/services/*v2; do
                              [[ -d "$d" ]] || continue
                              coverpkg="${coverpkg:+$coverpkg,}./$d"
                          done
                          scope_label="overall v4 v2 service packages"
                          ;;
                      v3)
                          for d in nutanix/services/*; do
                              [[ -d "$d" ]] || continue
                              case "$d" in *v2) continue ;; esac
                              coverpkg="${coverpkg:+$coverpkg,}./$d"
                          done
                          scope_label="overall v3 non-v2 service packages"
                          ;;
                      lcm) coverpkg="./nutanix/services/lcmv2"; scope_label="package ./nutanix/services/lcmv2" ;;
                      era) coverpkg="./nutanix/services/ndb"; scope_label="package ./nutanix/services/ndb" ;;
                      foundation) coverpkg="./nutanix/services/foundation"; scope_label="package ./nutanix/services/foundation" ;;
                      foundation_central) coverpkg="./nutanix/services/foundationCentral"; scope_label="package ./nutanix/services/foundationCentral" ;;
                      karbon) coverpkg="./nutanix/services/nke"; scope_label="package ./nutanix/services/nke" ;;
                      *) coverpkg="./..."; scope_label="all packages" ;;
                  esac
              fi

              # Fail closed: empty '|' alternatives match ALL tests.
              run_pattern="${TESTARGS#-run=}"
              if [[ "$run_pattern" == *"||"* || "$run_pattern" == "|"* || "$run_pattern" == *"|" ]]; then
                  echo "Error: -run pattern '$run_pattern' has an empty '|'-alternative."
                  echo "That regexp matches every test. Use spaces between names, not 'Name| Name'."
                  echo "  /ok-to-test TestAccFoo TestAccBar"
                  exit 1
              fi

              echo "TESTARGS = $TESTARGS"
              echo "Package path = $package_path"
              echo "Coverpkg = $coverpkg"
              echo "Coverage scope = $scope_label"
              echo "SCOPE_LABEL=$scope_label" >> "$GITHUB_ENV"
              echo "COVER_RUN_PATTERN=${TESTARGS#-run=}" >> "$GITHUB_ENV"
              echo "COVER_PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"

              rm -f c.out
              TF_LOG="ERROR" TF_ACC=1 GOTRACEBACK=all go test "$package_path" -v ${TESTARGS} -timeout 500m \
                -coverprofile c.out -covermode=atomic -coverpkg="$coverpkg" | tee test_output.log

              set +e  # Ignore failures

              # Ensure log file exists
              if [ ! -f test_output.log ]; then
                  echo "Error: test_output.log not found!"
                  exit 1  # Ignore missing file instead of failing
              fi

              # Extract total test cases executed safely (top-level RUN count)
              TOTAL_RUN=$(grep -c '^=== RUN' test_output.log)
              if [ "$TOTAL_RUN" -eq 0 ]; then
                  echo "No test cases executed. Exiting..."
                  exit 1
              fi

              # Use last result per test name so tests that run in a subprocess (e.g. NGT Insert ISO retry wrapper)
              # are counted and listed only once. The last result is the authoritative one (parent test).
              awk '
                /^--- (PASS|FAIL|SKIP): / {
                  result = $2; sub(/:$/, "", result);
                  name = $3;
                  last_result[name] = result;
                  last_line[name] = NR;
                }
                END {
                  for (n in last_result) {
                    print last_line[n], last_result[n], n
                  }
                }
              ' test_output.log | sort -n > test_results_by_last.txt

              # Count by last result (each test counted once)
              TOTAL_PASSED=$(awk '$2 == "PASS"' test_results_by_last.txt | wc -l)
              TOTAL_FAILED=$(awk '$2 == "FAIL"' test_results_by_last.txt | wc -l)
              TOTAL_SKIPPED=$(awk '$2 == "SKIP"' test_results_by_last.txt | wc -l)

              # Set output as successful for GitHub Actions which will be used in subsequent steps, Set only if tests were executed
              echo "tests_executed=tests_execution_successful" >> $GITHUB_OUTPUT

              # Calculate percentages safely (use unique test count)
              UNIQUE_TESTS=$((TOTAL_PASSED + TOTAL_FAILED + TOTAL_SKIPPED))
              PASS_PERCENT=0
              FAIL_PERCENT=0
              SKIP_PERCENT=0
              if [ "$UNIQUE_TESTS" -gt 0 ]; then
                  [ "$TOTAL_PASSED" -gt 0 ] && PASS_PERCENT=$((TOTAL_PASSED * 100 / UNIQUE_TESTS))
                  [ "$TOTAL_FAILED" -gt 0 ] && FAIL_PERCENT=$((TOTAL_FAILED * 100 / UNIQUE_TESTS))
                  [ "$TOTAL_SKIPPED" -gt 0 ] && SKIP_PERCENT=$((TOTAL_SKIPPED * 100 / UNIQUE_TESTS))
              fi

              # Write summary to a file (each test appears only once, under its last result)
              {
                echo "==================================================🧪 TEST SUMMARY 🧪================================================================================="
                echo "Total Test Cases Run 🚀: $UNIQUE_TESTS"
                echo "Total Test Cases Passed ✅: $TOTAL_PASSED ($PASS_PERCENT %)" 
                echo "Total Test Cases Failed ❌: $TOTAL_FAILED ($FAIL_PERCENT %)"
                echo "Total Test Cases Skipped ⚠️: $TOTAL_SKIPPED ($SKIP_PERCENT %)"
                echo "=================================================================================================================================================="
                echo ""
                echo "================================================== TESTS SUCCEEDED ✅ ============================================================================="
                if [ "$TOTAL_PASSED" -gt 0 ]; then
                    echo ""
                    awk '$2 == "PASS" { print "✅ " $3 }' test_results_by_last.txt || true
                else
                    echo "No tests passed 😞❗"
                fi
                echo "==================================================================================================================================================="
                echo ""
                echo "================================================== TESTS FAILED ❌ ================================================================================"
                if [ "$TOTAL_FAILED" -gt 0 ]; then
                    echo ""
                    awk '$2 == "FAIL" { print "❌ " $3 }' test_results_by_last.txt || true
                else
                    echo "🎉💃 No tests failed 🕺🎉"
                fi
                echo "==================================================================================================================================================="
                echo ""
                echo "================================================== TESTS SKIPPED ⚠️ =============================================================================="
                if [ "$TOTAL_SKIPPED" -gt 0 ]; then
                    echo ""
                    awk '$2 == "SKIP" { print "⚠️ " $3 "   : Reason: ➡️ :  See log for details" }' test_results_by_last.txt || true
                else
                    echo "🎉💃 No tests skipped 🕺🎉"
                fi
                echo "==================================================================================================================================================="
                echo ""

              } > test_summary.txt
              rm -f test_results_by_last.txt
              echo "TEST_SUMMARY_FILE=test_summary.txt" >> $GITHUB_ENV

              # Write to GitHub output for PR comment
              {
                echo "summary_content<<EOF"
                cat test_summary.txt
                echo "EOF"
              } >> "$GITHUB_OUTPUT"


              if [ "$TOTAL_FAILED" -gt 0 ]; then
                  echo ""
                  echo "================== FAILURE DETAILS OF TESTCASES EXECUTED ==============================================================================================="
                  grep '^=== RUN' test_output.log | awk '{print $3}' | while read -r test; do
                      if grep -q "^--- FAIL: $test" test_output.log; then
                          echo "TESTCASE: $test"
                          echo "========================================🔥🔥🔥🔥📝 TRACEBACK 📝🔥🔥🔥🔥 ======================================================================================="
                          awk "/=== RUN   $test/,/--- FAIL: $test/" test_output.log | sed 's/^/    /' || true
                          echo "==========================================================================================================================================================="
                          echo ""
                      fi
                  done
              fi

              echo "Tests Execution is done, please debug if any failures"

              # 🔁 This now ensures the stage fails if tests fail
              if [ "$TOTAL_FAILED" -gt 0 ]; then
                  echo "Making the stage fail due to test failures."
                  exit 1
              else
                  exit 0
              fi

      # Same coverage reporting as `make acc-test` (scripts/report-acc-coverage.sh)
      - name: Code Coverage Check
        if: ${{ always() && steps.test-execution.outputs.tests_executed == 'tests_execution_successful' }}
        env:
          TESTCOV_THRESHOLD: "85"
        run: |
          set -euo pipefail
          chmod +x scripts/report-acc-coverage.sh scripts/filter-acc-cover-by-tests.sh
          ./scripts/report-acc-coverage.sh c.out test_output.log \
            "${SCOPE_LABEL:-acceptance tests}" \
            "${COVER_RUN_PATTERN:-.}" \
            "${COVER_PACKAGE_PATH:-}"

      - name: Generate coverage HTML report
        if: ${{ always() && steps.test-execution.outputs.tests_executed == 'tests_execution_successful' }}
        run: |
          set -euo pipefail
          if [[ ! -s c.out ]]; then
            echo "c.out missing or empty; skipping HTML report"
            exit 0
          fi
          # Prefer files already written by report-acc-coverage.sh; regenerate if needed.
          if [[ ! -f coverage-report/coverage.html ]]; then
            mkdir -p coverage-report
            go tool cover -html=c.out -o coverage-report/coverage.html
            go tool cover -func=c.out > coverage-report/coverage.txt
            cp c.out coverage-report/c.out
          fi
          echo "Coverage HTML: coverage-report/coverage.html"
          tail -5 coverage-report/coverage.txt

      - name: Upload coverage report artifact
        if: ${{ always() && steps.test-execution.outputs.tests_executed == 'tests_execution_successful' }}
        uses: actions/upload-artifact@v4
        with:
          name: acc-coverage-report
          path: |
            coverage-report/coverage.html
            coverage-report/coverage.txt
            coverage-report/c.out
          if-no-files-found: warn
          retention-days: 14

      # Post build status along with test summary as a comment only if tests executed successfully
      - name: Post build status and test summary
        if: ${{ always() && steps.test-execution.outputs.tests_executed == 'tests_execution_successful' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            - 🧪 **`Build Status: `** `${{ job.status }}`
            - 📌 **`GitHub Action: `** [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📊 **`Code Coverage: `** `${{ env.CODE_COVERAGE_OUTPUT }}`
            - 📂 **`Coverage report:`** download the `acc-coverage-report` artifact from the Actions run (open `coverage.html` locally for green/red line view)
            - 📝 **`Test Summary: `**
            ```txt
            ${{ steps.test-execution.outputs.summary_content }}
            ```
          reaction-type: hooray
      
      # Post only Build Status and workflow info as Comment if tests execution is not successful
      - name: Post build status and workflow info
        if: ${{ always() && (steps.test-execution.outputs.tests_executed == 'tests_execution_not_successful' || !steps.test-execution.outputs.tests_executed) }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          body: |
            - 🧪 **`Build Status: `** `${{ job.status }}`
            - 📌 **`GitHub Action: `** [View GitHub Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - ℹ️ **`Tests were not successfully executed, so no summary is available.`**

          reaction-type: confused

      # Print job status
      - name: Workflow Status
        if: ${{ always() }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "failure" ]; then
            echo "Job Status: $STATUS 😢"
          else
            echo "Job Status: $STATUS ✅"
          fi

      - name: Debugging Information
        if: always()
        env:
          TESTS_EXECUTED: ${{ steps.test-execution.outputs.tests_executed }}
        run: |
          echo "Debugging information:"
          echo "tests_executed: $TESTS_EXECUTED"

          echo "GITHUB_ENV content:"
          cat "$GITHUB_ENV"

          echo "GITHUB_OUTPUT content:"
          cat "$GITHUB_OUTPUT" || echo "GITHUB_OUTPUT not found"

          echo "Test summary file content:"
          cat test_summary.txt || echo "No test summary file found."