name: 'PreChecks'

on: [push, pull_request]

jobs:
  lint-and-test:
    name: Vulnerability, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up Go 🐹
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: 🔐 Configure private Go modules
        env:
          INTERNAL_GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global url."https://${INTERNAL_GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE="github.com/nutanix-core/*"
          go env -w GONOSUMCHECK="github.com/nutanix-core/*" 2>/dev/null || true
          echo "GONOSUMCHECK=github.com/nutanix-core/*" >> "$GITHUB_ENV"

      - name: 🧹 Code Lint
        run: make tools && make lint

      - name: 🌐 Website Lint
        run: make tools && make website-lint

      - name: 🛡️ Vulnerability Check
        run: make tools && make vulncheck

      - name: ✅ Run Tests
        run: make test