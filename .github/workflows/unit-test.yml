name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Configure private Go modules
        env:
          INTERNAL_GH_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global url."https://${INTERNAL_GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE="github.com/nutanix-core/*"
          go env -w GONOSUMCHECK="github.com/nutanix-core/*" 2>/dev/null || true
          echo "GONOSUMCHECK=github.com/nutanix-core/*" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: make unit-test report

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: |
            coverage-report/unit/
            unit_c.out
            unit_test_output.log
          if-no-files-found: ignore
