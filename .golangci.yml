# =========================
# GolangCI-Lint Configuration
# =========================
# Schema version. Must be the string "2" — a bare `2` is rejected as a number.
version: "2"

# =========================
# Run Settings
# =========================
run:
  # Timeout for analysis
  timeout: 5m

  # Include test files
  tests: true

# =========================
# Linter Enable/Disable
# =========================
linters:
  default: all
  disable:
    - gocyclo
      # disabled gocyclo as we do have a lot of large methods to iterate thru the large JSON specs
    - dupl
      # disabled dupl as we do have a lot of duplicated code between resources and their tests, which gets flagged by this
    - errcheck
      # errcheck disabled to silence errors on unchecked d.Set(...) returns across every
      # resource. Re-enabling is tracked separately; it is a large, mechanical cleanup.
    - gosec
    - gochecknoinits
    - gochecknoglobals
    - funlen
    - gocognit
    - godox
    - wsl
    - wsl_v5
    - nestif
    - godot
    - goconst
    - unparam
    - unused
    - staticcheck
    - lll
    - mnd
    - varnamelen
    - exhaustruct
    - ireturn
    - depguard
    - nlreturn
    - cyclop
    - maintidx
    - err113
    - wrapcheck
    - testpackage
    - paralleltest
    - tparallel
    - noctx
    - forcetypeassert
    - errorlint
    - nonamedreturns
    - exhaustive
    - gocritic
    - revive
    - prealloc
    - intrange
    - perfsprint
    - inamedparam
    - tagliatelle
    - musttag
    - contextcheck
    - containedctx
    - dupword
    - predeclared

    # --------------------------------------------------------------------------
    # Linters added to golangci-lint after this config was last updated. They are
    # disabled to keep the gate at parity with the previously-intended rule set
    # rather than landing several hundred unrelated changes at once. Re-enabling
    # them one at a time is tracked as follow-up work.
    # --------------------------------------------------------------------------
    - canonicalheader
    - copyloopvar
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - forbidigo
    - funcorder
    - godoclint
    - interfacebloat
    - modernize
    - nilnil
    - noinlineerr
    - nosprintfhostport
    - tagalign
    - testifylint
    - thelper
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  # =========================
  # Linter Settings
  # =========================
  settings:
    govet:
      enable:
        - shadow
      disable:
        # The `inline` analyzer compares against the toolchain's stdlib rather than
        # the module's go directive, so it reports unactionable diffs on every build
        # with a newer Go than go.mod declares.
        - inline

    goconst:
      min-len: 2
      min-occurrences: 2

    misspell:
      locale: US

  # =========================
  # Exclusions
  # =========================
  exclusions:
    paths:
      - vendor
      - future
    rules:
      - path: _test\.go
        linters:
          - testpackage

# =========================
# Formatters
# =========================
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - vendor
      - future
