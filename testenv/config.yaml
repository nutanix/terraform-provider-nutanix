# ===== test_config.json (legacy "v3" config) =============================
# Fields for the legacy test_config.json filled by fill_test_config.py
# (mirrors preEnv/create_json_v3.tf). subnet_name + ad_rule_target are static
# inputs read from here; default_container_name, account_uuid, the users'
# directory_service_uuid and protection_policy are discovered from the local PC
# and the AZ-connected remote PC (az.remote_pc_ip above).
test_config:
  # Subnet the calm/self-service tests attach VMs to (looked up by name).
  subnet_name: vlan.800
  # Legacy test_config.json self_service names (mirrors preEnv/main_v3.tf).
  self_service:
    bp_name_with_snapshot_config: *self_service_bp_name_with_snapshot_config
    bp_name: *self_service_bp_name
    app_name_with_snapshot_config: *self_service_app_name_with_snapshot_config
  # AD group rule target asserted by the self-service ACP/quota tests.
  ad_rule_target:
    name: ADGroup
    values: sspadmin
  # IAM directory-service NAME (sanitized, no dots) whose extId is used as
  # users[].directory_service_uuid. Leave empty to derive it from the
  # iam.secondary_ad domain (qa.nucalm.io -> qa-nucalm-io).
  users_directory_service_name: "qa-nucalm-io"
  # AD accounts (sAMAccountName / short name) in the directory above whose real
  # userPrincipalName + displayName are looked up to fill the users[] block of
  # test_config.json. The fill script searches the directory for each name, so
  # the principal_name / expected_display_name are never hardcoded.
  users:
    - test1
    - test2
    - test3
  # AD group (in the directory above) that the user-groups "duplicate entity"
  # test expects to ALREADY exist in PC. The fill script pre-creates it (via the
  # v3 user_groups API) so the test's create collides, and records its resolved
  # distinguished_name / display_name / uuid as user_group_with_distinguished_name[0].
  duplicate_user_group_name: dnd_approval_group_1
  # AD groups (in the directory above) whose real distinguished_name backs the
  # remaining user-groups resource tests, discovered from the CONNECTED directory
  # and lowercased to match what PC stores/returns (never a disconnected dir):
  #   [1] -> TestAccNutanixUserGroups_basic        (directory_service_user_group)
  #   [2] -> TestAccNutanixUserGroups_WithOrgUnit  (directory_service_ou)
  # They map to user_group_with_distinguished_name[1], [2], ... in order.
  user_group_names:
    - dnd_approval_group_2
    - dnd_approval_group_3