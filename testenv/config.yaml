  # --- directory_services_main.primary_ad ---
  # _name is the dotted AD domain (vmmv2 uses it as the Windows domain).
  # service_name is the IAM directory-service name (no dots; derived when empty).
  primary_ad:
    name: *primary_ad_domain
    service_name: ""
    domain_name: *primary_ad_domain
    url: *primary_ad_url
    dns: *primary_ad_ip
    username: Administrator@systest.nutanix.com
    password: *ad_admin_pw
    users: []
    groups: []

  # --- directory_services_main.secondary_ad ---
  # The ssptest* users and dnd_approval_group_* groups live in qa.nucalm.io.
  # The users/groups keys stay as the config-map keys the Go tests look up; the
  # search strips the @domain suffix before querying.
  secondary_ad:
    name: *secondary_ad_domain
    service_name: ""
    domain_name: *secondary_ad_domain
    url: *secondary_ad_url
    dns: *secondary_ad_ip
    username: administrator@qa.nucalm.io
    password: *secondary_ad_pw
    users:
      - ssptest1@qa.nutanix.com
      - ssptest2@qa.nutanix.com
      - ssptest3@qa.nutanix.com
    groups:
      - dnd_approval_group_1
      - dnd_approval_group_2
      - dnd_approval_group_3
      - dnd_approval_group_4

  # --- directory_services_main.tertiary_ad ---
  # Extra AD kept in the config for convenience only; nothing consumes it yet, so
  # (like primary_ad) it is emitted values-only and NOT registered in IAM.
  tertiary_ad:
    name: *tertiary_ad_domain
    service_name: *tertiary_ad_service_name
    domain_name: *tertiary_ad_domain
    url: *tertiary_ad_url
    dns: *tertiary_ad_ip
    username: Administrator@qa.nutanix.com
    password: *ad_admin_pw
    users: []
    groups: []

  # --- OpenLDAP directory (for the LDAP user + user_group) ---
  # When name is set, an OPEN_LDAP directory is provisioned and a real user +
  # group are discovered from it to fill iam.users / iam.user_groups.
  openldap:
    name: open_ldap
    service_name: ""
    domain_name: iamopenldap.com
    url: ldap://10.111.69.234:389
    username: cn=admin,dc=iamopenldap,dc=com
    password: *nutanix_pw
    user_object_class: posixAccount
    user_search_base: dc=iamopenldap,dc=com
    username_attr: uid
    group_object_class: posixGroup
    group_search_base: ou=Group,dc=iamopenldap,dc=com
    group_member_attr: memberUid
    group_member_attr_value: uid
    group_search_type: RECURSIVE

  # --- users block ---  (user_type: LOCAL | LDAP | SAML)
  user:
    type: LOCAL
    name: tenant.group.user_230c2229
    first_name: Terraform
    last_name: Test
    email: Tenant.Group.User_230c2229@iamopenldap.com
    locale: en-US
    region: en-US
    password: *iam_user_pw
    force_reset: true
    directory_service_username: Tenant.Group.User_230c2229@iamopenldap.com
    # idp_source -> idp | primary | secondary ; directory_source -> primary | secondary | idp
    idp_source: idp
    directory_source: secondary

  # --- user_groups block ---  (group_type: LDAP | SAML)
  group:
    type: LDAP
    name: tenant.group_230c2229
    # SAML-only group name: must NOT match any real LDAP/AD group, otherwise the
    # backend resolves the SAML group to that directory group and rewrites its
    # distinguished_name, causing perpetual plan drift in the SAML user-group test.
    saml_name: tf_saml_group_230c2229
    distinguished_name: cn=tenant.group_230c2229,ou=group,dc=iamopenldap,dc=com
    idp_source: secondary

# ===== object_store block =================================================
# Object-store (Objects) deployment values consumed when deploying an object
# store cluster. Fill these in for your environment.
object_store:
  subnet_name: objects.800
  # Provisioning spec for the shared object-store subnet. subnet_name above is the
  # single source for the name; the fields below are the create-time inputs. The
  # subnet is created by prepare_pc.py (ensure_flow_managed_subnet) -- Terraform
  # (objects.tf) does NOT create it, to avoid two identical subnets.
  #
  # NOTE: AHV basic networking allows only ONE subnet per VLAN id, so this VLAN-800
  # subnet is ALSO reused by the Flow Controller (pc_prep.flow.subnet.name =
  # objects.800). The pool below is therefore sized for both: >= 9 free IPs for the
  # Flow Controller (SMSP) on top of the object-store VMs. It stays BELOW the
  # object-store reserved IPs (.133-.138) so the two never overlap.
  subnet:
    vlan_id: 800 # must match PC's VLAN (routable/trunked); also used by the Flow Controller
    default_gateway_ip: 10.44.76.1
    dhcp_server_address: 10.44.79.254
    ip_subnet: 10.44.76.0
    prefix_length: 22
    range_ip_pool_start: 10.44.77.113
    range_ip_pool_end: 10.44.77.132 # .113-.132 = 20 IPs (shared: object store + Flow Controller)
  bucket_name: "objectsbrowser"
  public_network_ips:
    - "10.44.77.133"
    - "10.44.77.134"
  storage_network_dns_ip:
    - "10.44.77.135"
    - "10.44.77.136"
  storage_network_vip:
    - "10.44.77.137"
    - "10.44.77.138"

# ===== prism block ========================================================
# Values for the prismv2 tests: PC deploy, PC unregistration, backup targets,
# restore source, and PC restore. Mirrors preEnv/prism.tf + create_json.tf.
# NOTE: bucket.access_key / bucket.secret_key are SECRETS -- they live here only
# because this file is gitignored. Never commit real keys (rotate if leaked).
prism:
  # PC deploy test: deploys a fresh PC from a PE. The fill script resolves the
  # cluster name from pe_ip (SSH via ssh.pe_* -> the PE's clusters v4 API; pin
  # jarvis_name to override) and reads default_gateway / subnet_mask / ip_range
  # from the Jarvis inventory:
  #   default_gateway <- nodes[0].network.default_gw
  #   subnet_mask     <- nodes[0].network.svm_subnet_mask
  #   ip_range        <- custom.v1_ip  (the reserved external IP)
  # pe_ip / version stay explicit inputs. The deploy network is NOT set here --
  # the deploy test creates the external subnet on the PE (a VLAN 0 subnet, as in
  # preEnv/prism.tf) and uses its ext_id. Set default_gateway / subnet_mask /
  # ip_range below only to override discovery. name_servers/ntp_servers come from
  # the shared dns.servers / ntp.servers lists.
  deploy_pc:
    pe_ip: "10.102.113.155"
    # pe_ip: "10.102.195.232"
    version: "pc.7.6"
    # External VLAN-0 subnet the deploy test uses as its deploy network. It is
    # created ONCE on the deploy PE by testenv/terraform (networking.tf, via the
    # aliased nutanix.deploy_pe provider) instead of by the test itself -- a
    # deployed PC can never be undeployed, so it permanently holds an IP on this
    # subnet, and a test-managed subnet would fail to delete at teardown ("has
    # address assignments"). The deploy test looks it up by this name via a data
    # source and feeds its ext_id into network_ext_id.
    subnet_name: tf-deploy-pc-external-subnet
    # jarvis_name: ""              # optional: pin the Jarvis cluster name
    # default_gateway: ""          # optional override (else from Jarvis)
    # subnet_mask: ""              # optional override (else from Jarvis)
    # ip_range:                    # optional override (else custom.v1_ip)
    #   begin: ""
    #   end: ""
  # PC to unregister. Provide only remote_pc_ip -- the fill script connects to it,
  # lists its clusters filtered by clusterFunction=PRISM_CENTRAL, and uses that
  # entity's extId as pc_ext_id (mirrors preEnv/prism.tf). The prepare_pc.py
  # `prism` step also AZ-pairs the local PC with this remote_pc_ip (via a v3
  # cloud_trust) so the unregistration test has a connected PC to unregister. If
  # the remote PC uses different creds, set remote_pc_username/remote_pc_password.
  # Leave remote_pc_ip empty to skip the unregistration test (it self-skips when
  # pc_ext_id is empty).
  unregister:
    remote_pc_ip: "10.101.240.21"

  # AWS S3 backup target (backup-target / restore-source / restore-points tests).
  bucket:
    name: *s3_bucket_name
    region: *s3_region
    access_key: *s3_access_key
    secret_key: *s3_secret_key

  # The test resets the password on the restored PC using the top-level admin
  # creds (cfg.pc_username / cfg.pc_password). skip_pc_restore_test gates the
  # (destructive) restore-PC test; keep true unless you intend to run it.
  pc_restore:
    skip_pc_restore_test: true

# ===== security block =====================================================
