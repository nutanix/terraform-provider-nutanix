# ---------------------------------------------------------------------------
# Config for testenv/fill_test_config.py (nested YAML form of testenv/.env).
#
#   python3 testenv/fill_test_config.py            # auto-uses this file
#   python3 testenv/fill_test_config.py --env testenv/.env   # use flat .env
#
# Nested keys flatten to the flat env names the script uses:
#   pc.endpoint           -> PC_ENDPOINT
#   iam.idp.metadata.url  -> IAM_IDP_METADATA_URL
# Lists become comma-joined strings. YAML anchors (&x / *x) deduplicate shared
# values; the `_secrets` block below is anchor-only and is skipped on load.
# ---------------------------------------------------------------------------

_secrets:
  # Environment variables that change across test environments. often change.
  # Prism Central endpoint (IP/DNS) the tests and prepare scripts connect to.
  pc_ip: &pc_ip "REDACTED_PC_IP"
  # AWS S3 backup-target credentials (recovery bucket.* tests).
  s3_bucket_name: &s3_bucket_name "REDACTED_S3_BUCKET_NAME"
  s3_region: &s3_region "REDACTED_S3_REGION"
  s3_access_key: &s3_access_key "REDACTED_S3_ACCESS_KEY"
  s3_secret_key: &s3_secret_key "REDACTED_S3_SECRET_KEY"
  # Azure Key Vault (HSM) credentials (security.kms.* tests).
  kms_endpoint_url: &kms_endpoint_url "REDACTED_KMS_ENDPOINT_URL"
  kms_key_id: &kms_key_id "REDACTED_KMS_KEY_ID"
  kms_tenant_id: &kms_tenant_id "REDACTED_KMS_TENANT_ID"
  kms_client_id: &kms_client_id "REDACTED_KMS_CLIENT_ID"
  kms_client_secret: &kms_client_secret "REDACTED_KMS_CLIENT_SECRET"


  # Environment variables that are the same across test environments. rarely change.
  admin: &admin admin
  # Common password reused by PC / CFG logins and OpenLDAP.
  nutanix_pw: &nutanix_pw "REDACTED_NUTANIX_PASSWORD"
  # AD directory-service Administrator password (iam directory_services_main.*_ad).
  ad_admin_pw: &ad_admin_pw "REDACTED_AD_ADMIN_PASSWORD"
  # Secondary AD (qa.nucalm.io) administrator password.
  secondary_ad_pw: &secondary_ad_pw "REDACTED_SECONDARY_AD_PASSWORD"
  # AD directory-service domains + LDAP endpoints (iam directory_services_main.*_ad).
  primary_ad_domain: &primary_ad_domain "REDACTED_PRIMARY_AD_DOMAIN"
  primary_ad_url: &primary_ad_url "REDACTED_PRIMARY_AD_URL"
  primary_ad_ip: &primary_ad_ip "REDACTED_PRIMARY_AD_IP"
  secondary_ad_domain: &secondary_ad_domain "REDACTED_SECONDARY_AD_DOMAIN"
  secondary_ad_url: &secondary_ad_url "REDACTED_SECONDARY_AD_URL"
  secondary_ad_ip: &secondary_ad_ip "REDACTED_SECONDARY_AD_IP"
  tertiary_ad_domain: &tertiary_ad_domain "REDACTED_TERTIARY_AD_DOMAIN"
  tertiary_ad_service_name: &tertiary_ad_service_name "REDACTED_TERTIARY_AD_SERVICE_NAME"
  tertiary_ad_url: &tertiary_ad_url "REDACTED_TERTIARY_AD_URL"
  tertiary_ad_ip: &tertiary_ad_ip "REDACTED_TERTIARY_AD_IP"
  # IAM LOCAL user password (iam.user.password).
  iam_user_pw: &iam_user_pw "REDACTED_IAM_USER_PASSWORD"
  # SSH credentials into the CVM (ssh.pc_password / ssh.pe_password).
  ssh_pc_pw: &ssh_pc_pw "REDACTED_SSH_PC_PASSWORD"
  ssh_pe_pw: &ssh_pe_pw "REDACTED_SSH_PE_PASSWORD"
  # Guest-OS password for the VMs prepare_pc.py provisions (iscsi / ngt) and the
  # vmm guest-OS credentials the tests SSH in with.
  vm_pw: &vm_pw "REDACTED_VM_PASSWORD"
  adfs_ls_url: &adfs_ls_url "REDACTED_ADFS_LS_URL"


# ===== Prism Central / Prism Element connection ============================
pc:
  endpoint: *pc_ip
  port: 9440
  username: *admin
  password: *nutanix_pw
  insecure: true

# ===== PC preparation (testenv/prepare_pc.py) =============================
# Tunables for enabling Network Controller/Flow, NuCalm/DR, and Objects. All
# optional -- sensible defaults are baked into the script.
pc_prep:
  #objects:
    # Objects has no dedicated enable API; prepare_pc launches it as a Marketplace
    # app, mirroring the Prism UI: it discovers the published "Objects" marketplace
    # item, fetches its blueprint template spec (which already carries this PC's
    # substrate address), POSTs /blueprints/marketplace_launch, then polls
    # /services/oss/status. Idempotent -- skipped if an "Objects" app already exists.
    #
    # marketplace_item_uuid: ""   # optional: pin the Objects marketplace item UUID
    #                             #           (else auto-discovered by name + version)
    #                             #   pre-baked spec verbatim instead of discovering it
    # poll: true                  # set false to launch without waiting
    #poll_timeout_seconds: 3600    # Objects deploy is slow; wait up to 1h
  lcm:
    # Version to downgrade the Policy Engine (Calm) LCM entity to, so the newer
    # version appears as an available upgrade for the lcm tests. Uses the SSH
    # creds (ssh.pc_username / ssh.pc_password) to reach the CVM. Requires sshpass.
    # Requires the `policy` step (Policy Engine) to have been deployed first.
    downgrade_version: "4.3.1"

  iscsi:
    # iSCSI-client VM (prepare_pc.py --only iscsi): creates a Linux VM from the
    # ubuntu image (images.ubuntu_image*), configures open-iscsi in-guest and
    # attaches the VM's iSCSI client to a Volume Group so the volumesv2
    # iSCSI-client tests have a registered client to read. Idempotent (no-op if
    # the VM already exists). Requires sshpass.
    vm_name: tf-vm-for-iscsi-clients
    volume_group_name: vg_for_iscsi
    vm_username: ubuntu
    vm_password: *vm_pw
  ngt:
    # NGT-upgrade VM (prepare_pc.py --only ngt): creates a Rocky8 VM, enables
    # NGT and installs an OLD NGT bundle in-guest so the vmmv2 NGT-upgrade test
    # has a VM with an available upgrade. The VM name comes from
    # vmm.ngt.ngt_upgrade_vm_name (below), which the test also reads. Idempotent
    # (no-op if the VM already exists). Requires sshpass.
    vm_username: nutanix
    vm_password: *vm_pw
    version: "4.1"
    installer_url: http://endor.dyn.nutanix.com/GoldImages/ngt-installer-bundles/ngt-installer-4.1.tar.gz
  self_service:
    # Self-Service / Calm fixtures (prepare_pc.py --only selfservice). The step
    # first verifies Calm is enabled from the marketplace (polls
    # GET /api/nutanix/v3/services/nucalm/status until service_enablement_status
    # == ENABLED and service_running_status == HEALTHY), then mirrors
    # preEnv/scripts/create_v3_project.sh (project + environment + credential +
    # snapshot policy) and preEnv/scripts/upload_bp.sh (import + patch the two
    # blueprints, optionally launch an app and run the snapshot action). All steps
    # are idempotent (existing entities are reused by name). The blueprint/app/
    # policy names below match the test_config.json self_service.* the tests read.
    project_name: tf-project-selfservice-v3
    project_description: "Test project created for the Self-Service v3 acceptance tests"
    environment_name: tf-test-env
    credential_name: tf_test_cred
    credential_username: root
    credential_password: *vm_pw
    snapshot_policy_name: test_local_snapshot_policy_local_account
    # Subnet the project/environment attach (looked up by name; falls back to
    # vmm.subnet_name when empty).
    subnet_name: vlan.800
    # Blueprint JSONs copied under testenv/payloads/ (uploaded via
    # /blueprints/import_file then patched with the resolved refs).
    blueprint1_file: testenv/payloads/test_terraform_bp.json
    blueprint1_name: &self_service_bp_name test_terraform_bp
    blueprint2_file: testenv/payloads/test_terraform_bp_with_snapshot_config.json
    blueprint2_name: &self_service_bp_name_with_snapshot_config test_terraform_bp_with_snapshot_config
    blueprint_disk_size_mib: 40960
    # Guest image the blueprints deploy from. Omitted on purpose so it falls back
    # to images.ngt_image / images.ngt_image_url (the Rocky8 image the ngt step
    # already provisions).
    # Blueprint 'admin' credential override (defaults to credential_username/password).
    bp_admin_username: *admin
    bp_admin_password: *nutanix_pw
    # Launch an app from the snapshot blueprint and run its snapshot action so a
    # recovery point exists (full upload_bp.sh parity). Set false to only
    # import + patch the blueprints.
    # Temporarily skipping app launch for now -- only import + patch blueprints.
    launch_apps: false
    bp2_app_name: &self_service_app_name_with_snapshot_config test_terraform_snapshot_restore_app
    bp2_app_description: "Self-Service snapshot restore app for acceptance testing"
    bp2_action_name: Snapshot_s1
  flow:
    # Flow Controller (prepare_pc.py --only flow). This step ENABLES (deploys) the
    # FLOW_CONTROLLER product on Prism Central: it resolves the managed VLAN subnet
    # the Flow Controller (SMSP) deploys into, then PUTs the product with
    # enablementState=ENABLED referencing that subnet's extId.
    #
    # domain_manager_id: ""      # optional override of the PC (domain manager) extId
    #
    # Phase 1 network prep: the Flow Controller needs >= 9 IPs handed out via DHCP,
    # so it must sit on a managed VLAN subnet. AHV basic networking allows only ONE
    # subnet per VLAN id, and the object store shares VLAN 800 (objects.800), so the
    # Flow Controller REUSES that same subnet rather than creating its own. The flow
    # step (ensure_flow_managed_subnet) creates-or-reuses this single VLAN-800 subnet
    # from object_store.subnet.* -- prepare_pc.py is its sole owner (Terraform does
    # NOT create it, to avoid two identical subnets), and its DHCP pool is sized for
    # both (see object_store.subnet above). Because they share one subnet, it must be
    # on the PC's routable/trunked VLAN (800).
    subnet:
      name: objects.800 # the single shared VLAN-800 subnet (created by prepare_pc.py)
      # cluster_ext_id: ""      # optional PE cluster override (else auto-discovered)
    # Deploying the Flow Controller (SMSP cluster) is slow (~90 min). The enable
    # task is polled for up to this many seconds (default 7200 = 2h). 
    enable_timeout: 7200
  nkp:
    # NKP (Nutanix Kubernetes Platform) cluster consumed by the networkingv2 VPC
    # kubernetes_clusters test. testenv/e2e_nkp_deploy.py drives this end-to-end.
    # It runs LOCALLY ON THE BASTION VM (which has docker/kind, and where the nkp
    # CLI bootstraps a management cluster) and: installs prerequisites, runs
    # `nkp create cluster nutanix`, installs Flow CNI (see flow_cni below), then
    # Flow-activates the cluster so its extId becomes a valid VPC
    # kubernetesClusters reference. NKP 2.17+ self-registers the cluster with PC
    # via the Konnector agent add-on; fill_test_config.py then discovers the
    # Flow-activated extId for networking.kubernetes_cluster_ext_id.
    #
    # Bastion VM. The deploy script runs the whole NKP/Flow workflow ON this VM:
    # when launched elsewhere it SSHes in (using the creds below), copies itself +
    # config.yaml over, and re-executes there. bastion_vm_name is also used by IP
    # auto-discovery to skip the PC/gateway.
    bastion_vm_name: nkp-bastion
    # Reachable IP/DNS of the bastion for SSH. Leave empty to discover it from
    # Prism Central by bastion_vm_name.
    bastion_host: ""
    bastion_ssh_username: ubuntu
    bastion_ssh_password: *nutanix_pw # matches the cloud-init password in vmm.tf
    # Set to a private-key path to use key auth instead of the password above;
    # leave empty to use the password (requires sshpass on the launching host).
    bastion_ssh_key_path: ""
    # Remote dir the script + config are copied into on the bastion.
    bastion_remote_dir: /tmp/nkp-deploy
    # NKP CLI tarball. e2e_nkp_deploy.py auto-installs nkp on the bastion from
    # this URL when the CLI is missing. Use an unauthenticated URL (e.g. an
    # internal filer mirror); signed portal URLs expire and must be refreshed.
    cli_download_url: "http://filer.calm.nutanix.com/Users/abhinav_bansal/nkp_v2.18.0_linux_amd64.tar.gz"
    # NKP cluster specs.
    cluster_name: nkp-cluster-99
    # pe_cluster_name and storage_container are AUTO-DISCOVERED from Prism Central
    # via the clustermgmt v4 API (the AOS-function Prism Element cluster, and the
    # container whose name starts with 'default-container-'), so they are NOT set
    # here. See discover_pe_cluster() / discover_storage_container() in
    # e2e_nkp_deploy.py.
    os_image_name: nkp-rocky-9.7-release-cis-1.35.2-20260626061237.qcow2
    subnet_name: vlan.800
    # control_plane_vip (kube-vip API-server VIP) and lb_ip_range (MetalLB pool)
    # MUST be static IPs in subnet_name, OUTSIDE the DHCP/IPAM pool and currently
    # unused (IPAM would otherwise lease them to VMs -> conflict; and the PC IP
    # must not fall inside lb_ip_range, per SOL-7079). Leave BOTH empty to
    # auto-discover: e2e_nkp_deploy.py reads subnet_name's IPAM pools from PC and
    # allocates free IPs outside them (ping-verified from the bastion). Set them
    # explicitly to pin/override.
    control_plane_vip: "" # empty => auto-discover
    lb_ip_range: "" # empty => auto-discover
    lb_ip_count: 2 # contiguous LB IPs to allocate when auto
    # Fallback ONLY used when subnet_name is not IPAM-managed (no pools via API):
    # a static window known to be outside DHCP to pick free IPs from.
    static_ip_window:
      start: 10.44.76.8
      end: 10.44.76.30
    control_plane_replicas: 1
    control_plane_vcpus: 4
    control_plane_memory_gib: 16
    # --self-managed installs the full Kommander suite; a single 4-vCPU worker is
    # not enough. Use 3 workers (or bump worker_vcpus to 8 with 1 replica).
    worker_replicas: 3
    worker_vcpus: 8
    worker_memory_gib: 16
    # Flow CNI: to reference a cluster in a VPC it must run Flow CNI and be
    # Flow-activated. NKP ships a default CNI (Cilium) and live-migration to Flow
    # is not supported (FEAT-19784) -- Flow must be present at CREATE time.
    #
    # e2e_nkp_deploy.py deploys via the BYO-CNI + HelmChartProxy path (the
    # native `addons.cni.provider: Flow` renders placeholder images
    # `nutanix/flow-*:1.0.0` that do not exist in any reachable registry, and its
    # managed addon ignores value overrides). Flow instead:
    #   nkp create bootstrap                        (local mgmt/kind cluster)
    #   nkp create cluster ... --dry-run -o yaml    (generate NKPCluster manifest)
    #   PyYAML: REMOVE addons.cni                   (BYO-CNI; nodes come up NotReady)
    #   kubectl apply + wait ControlPlaneReady
    #   pre-apply Flow CRDs + create cni-secret     (on the workload cluster)
    #   apply a HelmChartProxy for the priyankar    (harbor) nutanix-flow-cni build
    #   wait nodes Ready, then Flow-activate         (PATCH kubeconfig to PC)
    # See NKP_FLOW_CNI_RUNBOOK.md for the full rationale and troubleshooting.
    flow_cni:
      enabled: true                       # true => deploy Flow CNI (BYO + HCP)
      # Harbor registry hosting the priyankar dev build of the Flow chart+images.
      harbor: harbor.eng.nutanix.com
      chart_repo: oci://harbor.eng.nutanix.com/priyankar   # OCI repo with nutanix-flow-cni
      chart_version: "1.1.0-937"
      # VERSION-MATCHED image overrides (validated set for chart 1.1.0-937):
      #   flow-ovn-kubernetes:222 == ovnkube.sh 1.1.0 (NOT 251, which is the 1.0.0 line)
      flow_k8s_cni_repo: harbor.eng.nutanix.com/priyankar/flow-k8s-cni
      flow_k8s_cni_tag: "937"
      ovn_repo: harbor.eng.nutanix.com/priyankar/flow-ovn-kubernetes
      ovn_tag: "222"
      # Harbor pull creds. docker_auth_b64 is base64("<username>:<password>") and is
      # used both for the in-cluster cni-secret and global.dockerConfigSecret.
      # (Rotate if leaked; this is the svc.flow_nw robot account.)
      registry_username: svc.flow_nw
      docker_auth_b64: "c3ZjLmZsb3dfbnc6QXpxd0dydiZTaSpOeFhkaEI5JXA="
      # CAPI Cluster namespace the NKPCluster lands in. Empty => auto-detect after
      # create (kubectl get clusters.cluster.x-k8s.io -A). This run: kommander.
      capi_namespace: ""

# ===== clusters block =====================================================
cluster:
  # CVM IPs. When virtual_ip / iscsi_ip are omitted they are auto-assigned as the
  # first two *free* IPs after nodes[0] within its /24 (freeness judged by ping +
  # ARP). Set them explicitly here to pin.
  nodes: [10.102.147.238, "", "", ""]
  # virtual_ip: 10.103.242.250
  # iscsi_ip: 10.103.242.251

  # --- SSL certificate (clusters.ssl_certificate) ---
  # Generates a fresh rsa2048 leaf cert signed by a throwaway single-tier CA on the
  # fly via the openssl CLI (no external CA material / no preEnv dependency). The
  # cert is issued for cluster.virtual_ip (then the first node). To supply your own
  # material instead, set generate: false and add private_key(_file)/
  # public_certificate(_file)/ca_chain(_file). Only used by the cluster SSL-certificate
  # acceptance tests; drop this block if you don't run them.
  ssl:
    generate: true
    passphrase: nutanix

# ===== data_protection block ==============================================
# This block feeds test_config_v2.json's data_protection.* which the DP
# acceptance tests consume. remote_cluster_pe is an explicit input (the remote
# cluster those tests target). local_cluster_pe is discovered from the local PC
# when omitted. Both VIPs are auto-assigned as the first *free* IP after each PE
# within its /24 (freeness judged by ping + ARP). Pin any field to override.
#
# NOTE: this is separate from the prepare_pc dp firewall step, whose remote PE is
# the PE of the remote PC connected via the availability zone (az.remote_pc_ip).
dp:
  remote_cluster_pe: "10.102.147.240"

# ===== lcm block ==========================================================
# Life Cycle Manager entity (model + version) used by the lcm tests.
lcm:
  entity_model: "Policy Engine"
  entity_model_version: "4.4.0"

# ===== availability_zone block ============================================
# Remote PC used as a replication target by the data-protection / data-policies
# tests. Only remote_pc_ip is required: the fill script connects to that PC and
# discovers pc_ext_id (the PRISM_CENTRAL cluster entity extId) and cluster_ext_id
# (an AOS/PE cluster registered to it) via the v4 clusters API, mirroring
# preEnv/clusters.tf. Provide pc_ext_id / cluster_ext_id explicitly to skip
# discovery. If the remote PC uses different credentials than the local PC, set
# az.remote_pc_username / az.remote_pc_password.
az:
  remote_pc_ip: "10.102.145.71"

# ===== IAM =================================================================
iam:
  # IAM v4 API path version (v4.0 matches the proven preEnv scripts; the provider
  # SDK uses v4.1.b3 -- both generally work).
  api_version: v4.1.b3
  # Wire "format version" used only for the directory-service search envelope.
  fv: v4.r0.b3

  # --- identity_providers (SAML IdP) ---
  # The IdP named below is NOT created by the script (the SAML-IdP CRUD tests
  # create + destroy it). A separate persistent IdP ("<name>_persistent") is
  # created for iam.users.idp_id.
  idp:
    name: terraform_test_idp_name
    username_attr: terraform_test_idp_username
    email_attr: email
    groups_attr: groups
    groups_delim: ","
    entity_issuer: tf_integration_entity_issuer_test
    custom_attributes: [custom1, custom2]
    is_signed_authn: false
    metadata:
      # Uploaded as the create payload (raw SAML federation metadata).
      xml_file: testenv/federationmetadata.xml
      # Echoed into the config (xml = URL the iamv2 tests download for metadata).
      xml: http://filer.calm.nutanix.com/Users/abhinav_bansal/xml_content/content.txt
      url: https://samltest.id/saml/idp
      # Metadata blob the acceptance tests read via file(); copied to repo root.
      test_file: testenv/test_idp_metadata_env.txt
      entity_id: http://phxdevadfs02.calmsaastest.com/adfs/services/trust
      login_url: *adfs_ls_url
      logout_url: *adfs_ls_url
      error_url: *adfs_ls_url
      name_id_policy_format: emailAddress
      certificate: |
        -----BEGIN CERTIFICATE-----
