  # URL ever changes.
  iso_image_sha1: cce936c1f9d1448c7d8f74b76b66f42eb4f93d4a
  iso_image_sha256: bed8a55ae2a657f8349fe3271097cff3a5b8c3d1048cf258568f1601976fa30d
